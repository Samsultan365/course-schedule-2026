<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2742">
<meta name="application-name" content="课程表">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="课程表">
<meta name="description" content="个人课程与晚自习安排，支持离线查看。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>课程表</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--navy:#0f2742;--ink:#1f2937;--muted:#687382;--line:#e5eaf0;--teal:#149b91;--teal-bg:#e8f8f5;--purple:#7251b5;--purple-bg:#f3efff;--orange:#d95b36;--orange-bg:#fff1eb;--gray:#7b8490;--gray-bg:#eef1f4;--shadow:0 10px 28px rgba(15,39,66,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",sans-serif;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 30px}
.hero{background:linear-gradient(135deg,#0f2742,#143b5e);color:#fff;margin:0 -14px;padding:28px 22px 24px;border-radius:0 0 28px 28px;box-shadow:0 12px 30px rgba(15,39,66,.22)}
.hero h1{margin:0;font-size:28px;letter-spacing:.02em}
.hero p{margin:8px 0 0;color:#d4e2ef;font-size:14px}.hero .hero-note{color:#ffe1a3;font-weight:700}
.today{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px}
.today small{display:block;color:#bcd2e5;font-size:12px;margin-bottom:3px}
.today strong{font-size:17px}
.today .next{color:#fff;font-size:13px;text-align:right;max-width:54%}
.locate{border:0;background:#fff;color:var(--navy);border-radius:999px;padding:9px 13px;font-weight:700;white-space:nowrap}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px;font-size:12px;color:var(--muted)}
.legend span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.jump{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:0 0 auto;text-decoration:none;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}
.jump a.today-chip{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow);scroll-margin-top:14px}
.card.today-card{border-color:var(--teal);box-shadow:0 0 0 3px rgba(20,155,145,.12),var(--shadow)}
.card.special{border-color:#f2a17d;background:linear-gradient(180deg,#fff,#fffaf7);box-shadow:0 0 0 2px rgba(217,91,54,.08),var(--shadow)}
.card.holiday{background:#f8fafb}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}
.date-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.date{font-size:22px;font-weight:800;letter-spacing:.01em}
.weekday{font-size:14px;color:var(--muted)}
.badge{font-size:12px;font-weight:800;color:var(--teal);background:var(--teal-bg);border-radius:999px;padding:6px 10px;white-space:nowrap}
.special .badge{color:var(--orange);background:var(--orange-bg)}
.holiday .badge{color:var(--gray);background:var(--gray-bg)}
.note{margin:-3px 0 12px;color:var(--orange);font-size:13px;font-weight:700}
.items{display:grid;gap:9px}
.item{display:grid;grid-template-columns:106px minmax(0,1fr);gap:11px;align-items:center;border-radius:16px;padding:12px 13px;background:var(--teal-bg)}
.item.study{background:var(--purple-bg)}
.item.off{background:var(--gray-bg)}.item.pending{background:#fff8e8;border:1px dashed #e3a13a}
.time{font-weight:800;color:var(--teal);font-size:14px;white-space:nowrap}
.study .time{color:var(--purple)}
.off .time{color:var(--gray)}.pending .time{color:#b7791f}
.course{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.location{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.footer{background:var(--navy);color:#dbe8f4;border-radius:22px;padding:17px;margin-top:18px;font-size:13px}
.footer strong{display:block;color:#fff;font-size:16px;margin-bottom:9px}
.footer p{margin:5px 0}
.footer .tip{color:#a9c2d8;margin-top:10px}
.install-bar{display:none;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 2px;padding:13px 14px;border:1px solid #d7e3ec;border-radius:18px;background:#fff;box-shadow:var(--shadow)}.install-bar.show{display:flex}.install-copy strong{display:block;font-size:15px}.install-copy span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.install-button{border:0;border-radius:999px;background:var(--teal);color:#fff;font-weight:800;padding:10px 16px;white-space:nowrap}.app-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;color:#a9c2d8}.app-meta .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}.app-meta.offline .dot{background:#fbbf24}@media (max-width:420px){.hero h1{font-size:25px}.today{align-items:flex-start}.today .next{max-width:48%}.item{grid-template-columns:96px minmax(0,1fr);padding:11px}.course{font-size:16px}.date{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<h1>课程表</h1>
<p>2026–2027 第 1 学期 · 国庆前安排</p><p class="hero-note">星期六晚自习待定：19:30–21:05，以班级通知为准</p>
<div class="today">
<div><small>今天</small><strong id="todayTitle">正在加载</strong></div>
<div class="next" id="nextText"></div>
<button class="locate" type="button" onclick="locateToday()">定位今天</button>
</div>
</header>
<section class="install-bar" id="installBar"><div class="install-copy"><strong>安装“课程表”到手机</strong><span>添加桌面图标，支持离线打开</span></div><button class="install-button" type="button" id="installButton">安装</button></section>
<div class="legend"><span>绿色：课程</span><span>紫色：晚自习</span><span>黄色：晚自习待定</span><span>橙色：调休补课</span></div>
<nav class="jump" id="jump" aria-label="日期快速跳转"></nav>
<main id="schedule"></main>
<section class="footer">
<strong>节次时间对照</strong>
<p>第1–2节 08:00–09:40　第3–4节 10:00–11:40</p>
<p>第5–6节 14:30–16:10　第7–8节 16:25–18:05</p>
<p>晚自习 19:30–21:05</p>
<p class="tip">课程提前30分钟提醒 · 晚自习提前15分钟提醒</p><p class="app-meta" id="appMeta"><span class="dot"></span><span id="networkStatus">在线</span><span>·</span><span>版本 1.0.0</span><span>·</span><span>更新于 2026-09-18</span></p>
</section>
</div>
<script>

{id:'sep19',date:'2026-09-19',label:'9/19',dateLabel:'9月19日',weekday:'星期六',week:'星期六 · 晚自习待定',note:'星期六晚自习可能安排，以班级通知为准',items:[{start:'',end:'',time:'白天',title:'休息',location:'无白天课程',type:'off'},{start:'19:30',end:'21:05',time:'19:30–21:05',title:'晚自习（待定）',location:'地点待班级通知 · 是否上课以班级通知为准',type:'study pending'}]},
{id:'sep20',date:'2026-09-20',label:'9/20',dateLabel:'9月20日',weekday:'星期日',week:'调休补课',special:true,note:'补10月6日（第6周星期二）课程',items:[{start:'08:00',end:'09:40',time:'08:00–09:40',title:'大学英语（一）',location:'宝教一106',type:'class'},{start:'10:00',end:'11:40',time:'10:00–11:40',title:'电路分析基础',location:'宝教三503',type:'class'},{start:'14:30',end:'16:10',time:'14:30–16:10',title:'思想道德与法治',location:'宝教三204',type:'class'},{start:'19:30',end:'21:05',time:'19:30–21:05',title:'晚自习',location:'地点待班级通知',type:'study'}]},
{id:'sep21',date:'2026-09-21',label:'9/21',dateLabel:'9月21日',weekday:'星期一',week:'第4周',items:[{start:'10:00',end:'11:40',time:'10:00–11:40',title:'大学体育（一）',location:'宝盖300米篮球场5',type:'class'},{start:'14:30',end:'16:10',time:'14:30–16:10',title:'高等数学A（一）',location:'宝教三501',type:'class'},{start:'16:25',end:'18:05',time:'16:25–18:05',title:'军事理论',location:'宝教二408',type:'class'},{start:'19:30',end:'21:05',time:'19:30–21:05',title:'晚自习',location:'地点待班级通知',type:'study'}]},

{id:'sep23',date:'2026-09-23',label:'9/23',dateLabel:'9月23日',weekday:'星期三',week:'第4周',items:[{start:'08:00',end:'09:40',time:'08:00–09:40',title:'高等数学A（一）',location:'宝教三501',type:'class'},{start:'19:30',end:'21:05',time:'19:30–21:05',title:'晚自习',location:'地点待班级通知',type:'study'}]},
{id:'sep24',date:'2026-09-24',label:'9/24',dateLabel:'9月24日',weekday:'星期四',week:'第4周',items:[{start:'08:00',end:'09:40',time:'08:00–09:40',title:'大学英语（一）',location:'宝教一106',type:'class'},{start:'16:25',end:'18:05',time:'16:25–18:05',title:'计算机应用技术',location:'宝实A407 计算机实验室五',type:'class'},{start:'19:30',end:'21:05',time:'19:30–21:05',title:'晚自习',location:'地点待班级通知',type:'study'}]},
{id:'holiday',start:'2026-09-25',end:'2026-09-27',label:'9/25–27',dateLabel:'9月25日–27日',weekday:'周五–周日',week:'中秋假期',holiday:true,items:[{start:'',end:'',time:'假期',title:'不安排课程和晚自习',location:'9月28日恢复上课',type:'off'}]},
{id:'sep28',date:'2026-09-28',label:'9/28',dateLabel:'9月28日',weekday:'星期一',week:'第5周',items:[{start:'10:00',end:'11:40',time:'10:00–11:40',title:'大学体育（一）',location:'宝盖300米篮球场5',type:'class'},{start:'14:30',end:'16:10',time:'14:30–16:10',title:'高等数学A（一）',location:'宝教三501',type:'class'},{start:'16:25',end:'18:05',time:'16:25–18:05',title:'军事理论',location:'宝教二408',type:'class'},{start:'19:30',end:'21:05',time:'19:30–21:05',title:'晚自习',location:'地点待班级通知',type:'study'}]},
{id:'sep29',date:'2026-09-29',label:'9/29',dateLabel:'9月29日',weekday:'星期二',week:'第5周',items:[{start:'08:00',end:'09:40',time:'08:00–09:40',title:'大学英语（一）',location:'宝教一106',type:'class'},{start:'10:00',end:'11:40',time:'10:00–11:40',title:'电路分析基础',location:'宝教三503',type:'class'},{start:'14:30',end:'16:10',time:'14:30–16:10',title:'大学英语（一）',location:'宝实A515 语音室',type:'class'},{start:'19:30',end:'21:05',time:'19:30–21:05',title:'晚自习',location:'地点待班级通知',type:'study'}]},
{id:'sep30',date:'2026-09-30',label:'9/30',dateLabel:'9月30日',weekday:'星期三',week:'第5周',items:[{start:'08:00',end:'09:40',time:'08:00–09:40',title:'高等数学A（一）',location:'宝教三501',type:'class'},{start:'10:00',end:'11:40',time:'10:00–11:40',title:'人工智能通识与应用',location:'宝教一406',type:'class'},{start:'19:30',end:'21:05',time:'19:30–21:05',title:'晚自习',location:'地点待班级通知',type:'study'}]}
];
function dateKey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function isToday(day,todayKey){if(day.start&&day.end){return todayKey>=day.start&&todayKey<=day.end}return day.date===todayKey}
function minutes(t){if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m}
function render(){
 const root=document.getElementById('schedule'),jump=document.getElementById('jump'),todayKey=dateKey(new Date());
 schedule.forEach(day=>{
  const a=document.createElement('a');a.href='#'+day.id;a.textContent=day.label;if(isToday(day,todayKey))a.className='today-chip';jump.appendChild(a);
  const card=document.createElement('article');card.id=day.id;card.className='card'+(day.special?' special':'')+(day.holiday?' holiday':'')+(isToday(day,todayKey)?' today-card':'');
  const head=document.createElement('div');head.className='card-head';head.innerHTML='<div><div class="date-line"><span class="date">'+day.dateLabel+'</span><span class="weekday">'+day.weekday+'</span></div></div><span class="badge">'+day.week+'</span>';card.appendChild(head);
  if(day.note){const n=document.createElement('div');n.className='note';n.textContent=day.note;card.appendChild(n)}
  const items=document.createElement('div');items.className='items';day.items.forEach(item=>{const row=document.createElement('div');row.className='item '+(item.type||'class');row.innerHTML='<div class="time">'+item.time+'</div><div><div class="course">'+item.title+'</div><div class="location">'+item.location+'</div></div>';items.appendChild(row)});card.appendChild(items);root.appendChild(card)
 });
 const today=schedule.find(d=>isToday(d,todayKey));const title=document.getElementById('todayTitle'),next=document.getElementById('nextText');
 if(!today){title.textContent='国庆前课表';next.textContent='查看9月17日–30日安排';return}
 title.textContent=today.dateLabel+' '+today.weekday;
 const now=new Date(),nowMin=now.getHours()*60+now.getMinutes();const timed=today.items.filter(i=>i.start);const target=timed.find(i=>nowMin<=minutes(i.end))||timed.find(i=>nowMin<minutes(i.start));
 if(today.holiday||today.items.every(i=>i.type==='off'))next.textContent='今天休息';
 else if(target)next.textContent='下一项 '+target.time+' '+target.title;
 else next.textContent='今日安排已结束';
}
function locateToday(){const todayKey=dateKey(new Date());const day=schedule.find(d=>isToday(d,todayKey));document.getElementById(day?day.id:'sep17').scrollIntoView({behavior:'smooth',block:'start'})}
render();
const APP_VERSION='1.0.0';
let installPrompt=null;
const installBar=document.getElementById('installBar');
const installButton=document.getElementById('installButton');
const appMeta=document.getElementById('appMeta');
const networkStatus=document.getElementById('networkStatus');
function updateNetworkStatus(){const online=navigator.onLine;networkStatus.textContent=online?'在线':'离线可查看';appMeta.classList.toggle('offline',!online)}
window.addEventListener('online',updateNetworkStatus);
window.addEventListener('offline',updateNetworkStatus);
updateNetworkStatus();
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installBar.classList.add('show')});
installButton?.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBar.classList.remove('show')});
window.addEventListener('appinstalled',()=>{installPrompt=null;installBar.classList.remove('show')});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').then(registration=>{registration.addEventListener('updatefound',()=>{const worker=registration.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller){worker.postMessage({type:'SKIP_WAITING'})}})})}).catch(error=>console.warn('离线服务注册失败',error)))}
navigator.serviceWorker?.addEventListener('controllerchange',()=>{if(!sessionStorage.getItem('schedule-reloaded')){sessionStorage.setItem('schedule-reloaded','1');location.reload()}});</script>
</body>
</html>
