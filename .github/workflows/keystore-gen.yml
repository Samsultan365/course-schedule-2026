name: Generate signing keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias course-schedule \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass CsK2026x9Zq \
            -keypass CsK2026x9Zq \
            -dname "CN=Course Schedule, OU=Personal, O=CourseSchedule, L=Quanzhou, ST=Fujian, C=CN"
          base64 -w0 release.keystore > keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: |
            release.keystore
            keystore.b64
          if-no-files-found: error